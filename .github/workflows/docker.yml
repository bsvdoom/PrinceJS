name: Docker Build

on:
  push:
    branches:
      - master
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "index.html"
      - "site.webmanifest"
      - "assets/**"
      - "lib/**"
      - "src/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches:
      - master
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "index.html"
      - "site.webmanifest"
      - "assets/**"
      - "lib/**"
      - "src/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: princejs-enhanced:ci
